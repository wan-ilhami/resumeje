name: Sync Versions

on:
  repository_dispatch:
    types: [version-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version in README
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "$COMPONENT" = "frontend" ]; then
            sed -i "s|<!-- FRONTEND_VERSION -->.*<!-- /FRONTEND_VERSION -->|<!-- FRONTEND_VERSION -->$VERSION<!-- /FRONTEND_VERSION -->|" README.md
          elif [ "$COMPONENT" = "backend" ]; then
            sed -i "s|<!-- BACKEND_VERSION -->.*<!-- /BACKEND_VERSION -->|<!-- BACKEND_VERSION -->$VERSION<!-- /BACKEND_VERSION -->|" README.md
          fi

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: sync ${{ github.event.client_payload.component }} version to ${{ github.event.client_payload.version }} [skip ci]"
          git push

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.CENTRALIZED_DISPATCH_TOKEN }}
          COMPONENT: ${{ github.event.client_payload.component }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          FRONTEND_VER=$(grep -oP '(?<=<!-- FRONTEND_VERSION -->)[^<]+(?=<!-- /FRONTEND_VERSION -->)' README.md)
          BACKEND_VER=$(grep -oP '(?<=<!-- BACKEND_VERSION -->)[^<]+(?=<!-- /BACKEND_VERSION -->)' README.md)

          if [ "$COMPONENT" = "frontend" ]; then
            TITLE="Frontend v${VERSION}"
            SOURCE_REPO="wan-ilhami/resumeje-frontend"
          else
            TITLE="Backend v${VERSION}"
            SOURCE_REPO="wan-ilhami/resumeje-backend"
          fi

          TAG="${COMPONENT}-v${VERSION}"

          SOURCE_NOTES=$(gh release view "v${VERSION}" --repo "$SOURCE_REPO" --json body --jq '.body' 2>/dev/null || echo "")

          {
            printf '## Platform Versions\n\n| Package | Version |\n|---|---|\n| Frontend | %s |\n| Backend | %s |\n' "$FRONTEND_VER" "$BACKEND_VER"
            if [ -n "$SOURCE_NOTES" ]; then
              printf '\n\n---\n\n## Changes\n\n%s\n' "$SOURCE_NOTES"
            fi
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md
