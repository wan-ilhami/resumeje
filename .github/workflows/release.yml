# This workflow is intentionally disabled.
# Version updates are handled by sync-versions.yml via repository_dispatch
# from the frontend and backend private repos.
#
# The centralized-resume repo does not run semantic-release itself —
# it receives version-updated events and updates README.md in response.

name: Release (disabled)

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use sync-versions.yml — this workflow is a no-op."
